# docker-compose.yml

services:
  # 1. Postgres (Chat History)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ragadmin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. Redis (Cache)
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    profiles: ["search", "analytics", "products", "observability"]

  # Local-only search administration UI. Security is intentionally disabled in
  # the dev OpenSearch profile; keep this service behind an SSH tunnel.
  analytics-api:
    build:
      context: .
      dockerfile: services/analytics-api/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - ENV=dev
      - ANALYTICS_DB_URL=postgresql://ragadmin:changeme@postgres:5432/rag_db
      - ANALYTICS_DEMO_MODE=${ANALYTICS_DEMO_MODE:-true}
      - ANALYTICS_OPENSEARCH_URL=${ANALYTICS_OPENSEARCH_URL:-http://opensearch:9200}
      - ANALYTICS_CONTEXT_INDEX=${ANALYTICS_CONTEXT_INDEX:-context-v1}
      - ANALYTICS_DASHBOARDS_URL=${ANALYTICS_DASHBOARDS_URL:-http://opensearch-dashboards:5601}
      - ANALYTICS_CONTEXT_BOOTSTRAP=${ANALYTICS_CONTEXT_BOOTSTRAP:-true}
      - ANALYTICS_LLM_MODEL=${ANALYTICS_LLM_MODEL:-gpt-4o-mini}
      - ANALYTICS_LLM_BASE_URL=${ANALYTICS_LLM_BASE_URL:-}
      - ANALYTICS_LLM_API_KEY=${ANALYTICS_LLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANALYTICS_CORS_ORIGINS=http://localhost:5174
    depends_on:
      postgres:
        condition: service_started
      opensearch:
        condition: service_healthy
    profiles: ["analytics", "products"]

  analytics-web:
    build:
      context: apps/analytics-web
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    environment:
      - ANALYTICS_API_HOST=analytics-api:8090
    depends_on:
      - analytics-api
    profiles: ["analytics", "products"]

  # Discovery runs on fictional generated data with fake providers: no
  # databases or search cluster. Start with: docker compose --profile discovery up -d
  # then open http://localhost:5175
networks:
  rag-network:
    driver: bridge

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
