    intent_coverage_k0:
      status: approved
      approved_by: user
      approved_at: 2026-11-19
      scope: "K0 (review) of docs/design/INTENT_COVERAGE_CHECK_PLAN.md with its five recommended answers: a lexical coverage check after the echo check that can only be stricter; the first release is option A (refuse, naming the unaccounted words to the requester) with option B (confirm, with S6) to follow; domain words belong in certified synonyms and the neutral list stays generic and small; the owner writes a 20-question hold-out before K3 and K3 waits for those numbers; certifying synonyms (S4) waits for K3. It approves the OFFLINE builds K1 and K2 only. It does NOT approve K3 (enforcing it for any tenant), K4 (the confirm path), S4 or any live run."
      record: "Asked \"Approve K0 with the recommended answers?\" with options \"Approve K0\" and \"Change something\"; the user answered \"Approve K0\" on 2026-11-19."
    passthrough_design_decisions:
      status: approved
      approved_by: user
      approved_at: 2026-11-21
      scope: "Design decisions only for per-user identity pass-through, recorded in docs/design/PER_USER_PASSTHROUGH_DESIGN.md: the independent review's changes N1 to N6 become design requirements; no refresh tokens in v1; a strict per-run user-mapping rule; agents never get pass-through; a failed tag read in the L4 reader refuses the whole run. It does NOT approve building pass-through, any live test, any deployment, or deleting the old Databricks token on the owner's behalf (the owner does that)."
      record: "Offered recommendations 1 to 9; the user answered \"accept 1 to 5 and 9\" on 2026-11-21. Item 9, deleting the old token, is the owner's own action in the workspace."
    connect_mode_cm1_decisions:
      status: approved
      approved_by: user
      approved_at: 2026-11-17
      scope: "Four open decisions (2 to 5) of docs/security/CONNECT-MODE-threat-model.md for Connect mode (a customer's own warehouse). Design decisions only; they approve no build gate, security gate, live run or customer connection."
      answers:
        model_egress: "Asked whether customer data or schema may be sent to a language model in Connect mode; the user answered \"Per-customer opt-in\". Meaning: off by default; a customer may turn it on after a data processing agreement and a redaction review of their real schema."
        default_minimum_group_size: "Asked whether small-group suppression should be on by default in Connect mode (options: on at 10 as the pilot, or off); the user answered \"Off by default\". Meaning: no suppression unless the customer sets one. Recorded residual risk: small groups can identify people and suppression alone does not stop differencing (threat T10); the pilot demo stays at 10; the Connect-mode default differs from the pilot."
        reviewer: "Asked who should do the independent security review and penetration test; the user answered \"use specialize agent for review\". Recorded as: a specialist-agent review is used for Connect mode. It is an advisory review, like the decision-register panel. It is not an independent human review and not a penetration test, and the threat model's acceptance criterion 12 (independent review and penetration test) is not met by it; whether it satisfies the security gate is the owner's call at the gate."
        first_design_partner: "Asked which first design partner should scope the first build; the user answered \"Snowflake, mid-size, low-sensitivity data (Recommended)\". Meaning: Snowflake first, a data team at a mid-size company, no regulated personal data to start. No partner is named or approached."

    connect_mode_product_run_confirmed:
      status: approved
      approved_by: user
      approved_at: 2026-11-17
      scope: "Confirms connect_mode_admin_setup_product_run after the owner was shown a finding that a hosted sign-in still needs a one-time admin step. Design decision only."
      record: "After being shown that a hosted product-run sign-in needs the customer to register Compass as an OAuth client first (Snowflake: ACCOUNTADMIN or CREATE INTEGRATION; Databricks: an account admin), and that the script path is therefore needed either way, the user was asked whether to keep product-run as the plan or make the script first-class, and answered \"Keep product-run\" on 2026-11-17. Recorded in the user's words. Meaning: product-run setup stays the intended default for Connect mode, with the exported script as the fallback; the script path built in CM4 stays as the working path until product-run exists. It approves no build gate, no security gate, no live run and no customer connection."
      follow_ups: "Product-run needs, and does not yet have: a one-time client-registration step in the customer's account (an admin action, so a script or a vendor-side consent), a hosted OAuth sign-in (authorization-code flow with state and PKCE, token held in memory only), a way to avoid a pasted client secret (a public client type, unverified, or a secret handoff design), and a live check on the owner's sandbox accounts, each live step needing approval."

