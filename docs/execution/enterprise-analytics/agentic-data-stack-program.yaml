      evidence: "Run on 2026-11-15 (code: main after PR #30). Result: kept 2 metrics and 3 dimensions, no drops, 0 validator escapes, 0 leaked secrets, 0 injected canaries, recall 1.00 and 1.00 against sales-demo@v1; schema fingerprint 3feeaf88, the same as the local M4a draft. Three attempts were needed: the Azure CLI (2.84.0) hung on firewall-rule create in attempts 1 and 3 although the rule was created, and attempt 2 failed before creating anything because --no-wait is not supported there. Attempts 1 and 3 each left one rule (m4b-temp-20261115, one address, the owner's machine, not recorded here) in place for roughly 15 to 21 minutes, not only the seconds the draft run took. Each was removed and the rule list re-read: only allow-azure-services remained after each. Nothing else in Azure was changed. Secrets (the role's connection string, the model key) were read into the process environment and not printed. Draft files are on the local branch draft/m4b-pilot-ontology, not pushed; a pull request waits for the owner's word."

