schema_version: 1
program_id: agentic-data-stack
source_plan: ../../AGENTIC_DATA_STACK_EXECUTION_PLAN.md
status: in_progress

status_values:
  - planned
  - ready
  - in_progress
  - blocked
  - review
  - complete

rules:
  packet_directory: .
  packet_name: "<TASK-ID>-<short-name>.md"
  one_task_per_branch: true
  commit_required: true
  independent_review_required: true
  push_after_milestone: true
  no_self_approval:
    - architecture
    - security
    - semantic_certification
    - threshold_change
    - final_go_no_go

validation:
  - ruff check packages/platform_contracts services/analytics-api/app services/analytics-api/tests
  - (cd services/analytics-api && PYTHONPATH=.:../.. pytest -q)
  - git diff --check

milestones:
  M0:
    name: Program and graph foundations
    status: complete
    waves:
      - [ADS-001, ADS-007, ADS-008]
      - [ADS-002]
      - [ADS-003]
      - [ADS-004, ADS-005, ADS-006]
      - [ADS-009]
    human_gate: architecture_and_security
    human_gate_status: approved
    human_gate_approved_at: 2026-10-13
    human_gate_approval_record: "User wrote \"I approved M0/M1/M5/M6/M7 gates\" in conversation on 2026-10-13, naming M0 (architecture_and_security). Recorded as the gate approval only, in the user's words; the user gave no scope or conditions. This does not approve any threshold or policy file, the reference corpus, the five ADS-079 sign-offs, or independent review of any packet; it does not change any packet status (implemented packets stay `review`), and it does not make any semantic contract certified in the registry. Open items at the time of recording are in reports/ADS-079-evidence-manifest.md."
