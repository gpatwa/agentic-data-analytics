      scope: "The fifteen gate decisions G1 to G15 in docs/DECISION_REGISTER_2026-11-16.md, taken one by one."
      record: "The owner asked a four-agent panel for recommendations (three Opus specialists and a Fable 5.2 low-effort second opinion), then chose \"Go one by one\" and answered each gate decision in turn. Each answer below is the option the user selected, in its own words; the panel's recommendation is advisory and approves nothing by itself. This approves these fifteen choices only. It does not approve any live run, account creation, certification of a specific contract (G1 says who certifies, and each contract is certified separately), public wording beyond G13, or any deploy."
      decisions:
        - {id: G1, topic: "Who certifies the reference definitions", answer: "Me, via reviewed PR (Recommended)"}
        - {id: G2, topic: "Where the permanent reference warehouse lives", answer: "Compass-owned demo accounts (Recommended)"}
        - {id: G3, topic: "Public wording about Snowflake and Databricks (the public demo stays PostgreSQL-only until R5 in every option)", answer: "Wait until R5"}
        - {id: G4, topic: "Pull requests #28 and #32 (uncertified drafts)", answer: "Close both, keep branches (Recommended)"}
        - {id: G5, topic: "Admin sign-in methods", answer: "SSO, a key you control, export-SQL (Recommended)"}
        - {id: G6, topic: "Provisioning a customer's warehouse (Connect mode)", answer: "No approval now; write the threat model now (Recommended)"}
        - {id: G7, topic: "Spending caps for setup", answer: "Default, override can lower freely (Recommended)"}
        - {id: G8, topic: "Contents of the consent record", answer: "Full list plus hash, never a credential (Recommended)"}
