      scope: "Run the warmup_provision_check: the warm-up deployment check with --provision on this computer against https://dbc-b8672746-8e43.cloud.databricks.com, catalog and schema dev.compass_synthetic_food_delivery (views orders_current and orders_usd_gross), warehouse Serverless Starter Warehouse, using the owner's signed-in CLI profile to create one temporary service principal named compass-conn- followed by 8 random hex characters (the product's own registration script), one OAuth secret held only in memory, USE CATALOG, USE SCHEMA and SELECT on those two views and CAN_USE on the named warehouse, and to remove all of it in the same run (and by --sweep if interrupted). At most four certified warm-up queries (each with the gateway's own EXPLAIN COST and two session SETs), one read-only listing of warehouses, a 20-minute cap. It does NOT approve any deployment or Azure change, changing any warehouse, any other schema or table, any grant or write beyond the list above, a model call, installing anything on the owner's behalf, or certifying anything."
      record: "The agent drafted this scope in docs/design/SELF_SERVE_CONNECT_DESIGN.md and showed it; the user answered \"Approved, run it\" on 2026-11-23."
    enrol_file_live_check:
      status: approved
      approved_by: user
      approved_at: 2026-11-23
      scope: "Run the enrol_file_live_check on this computer against https://dbc-b8672746-8e43.cloud.databricks.com, catalog and schema dev.compass_synthetic_food_delivery (views orders_current and orders_usd_gross), warehouse Serverless Starter Warehouse, using the owner's signed-in CLI profile: serve a local instance of the app on localhost; run the generated enrol file, which creates one temporary service principal named compass-conn- followed by 8 random hex characters, one OAuth secret held only in memory, USE CATALOG, USE SCHEMA and SELECT on those two views and CAN_USE on the named warehouse; read both views as that principal; at most four certified warm-up queries (each with the gateway's own EXPLAIN COST and two session SETs); run the generated rotate file once, which creates one further secret for that principal and deletes the older ones; then remove the principal and its grants with the enrol file's --remove, list the workspace's service principals and warehouses read-only to confirm, and in every case remove the principal named exactly as this run's by id; a 20-minute cap. It does NOT approve any deployment or Azure change, changing any warehouse, any other schema or table, any grant or write beyond the list above, a model call, installing anything on the owner's behalf, or certifying anything."
