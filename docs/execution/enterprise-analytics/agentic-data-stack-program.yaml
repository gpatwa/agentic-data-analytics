        record: "Asked \"Accept the two extra drafted items?\" with options \"Accept both\" and \"Reject one or both\", the user answered \"Accept both\" on 2026-11-14. 2 of 2 accepted, above the 80 percent condition. This accepts them as reasonable drafts for the evaluation's precision condition only. It does not certify them: semantic certification of any contract is a separate owner gate."

