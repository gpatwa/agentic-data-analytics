# .github/workflows/ci-analytics.yml
# Analytics backend CI. Support has its own workflow: ci-support.yml.
name: CI (analytics backend)

on:
  push:
    branches: [main]
    paths:
      - "services/analytics-api/**"
      - "packages/**"
      - "pyproject.toml"
      - "infra/terraform/azure-analytics-pilot/**"
      - ".github/workflows/ci-analytics.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/analytics-api/**"
      - "packages/**"
      - "pyproject.toml"
      - "infra/terraform/azure-analytics-pilot/**"
      - ".github/workflows/ci-analytics.yml"

# Jobs run on ubuntu-24.04, not ubuntu-latest (26.04), because 26.04 has no Python 3.12.3 build.
env:
  # Pin to 3.12.3 specifically: Python >=3.12.5 made ForwardRef._evaluate
  # require a `recursive_guard` kwarg, which pydantic v1 (used transitively
  # by langsmith via langgraph) doesn't pass — 5 tests fail at import time.
  # Bump after upgrading langgraph / langsmith / pydantic accordingly.
  PYTHON_VERSION: "3.12.3"

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Analytics API Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/analytics-api/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        working-directory: services/analytics-api
        run: ruff check app tests ../../packages --output-format=github

  # The tests run as parallel parts (services/analytics-api/ci_parts.py) so the slowest part sets the time and each part reports its own slowest tests.
  analytics-test:
    name: Analytics API Test (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [eval-ads056, eval-ads057, eval-corpora-a, eval-corpora-b, synthetic, rest]
    defaults:
      run:
        working-directory: services/analytics-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/analytics-api/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-xdist
          pip install -r requirements-reference-data.txt

      - name: Run tests (${{ matrix.part }})
        env:
          PYTHONPATH: ${{ github.workspace }}/services/analytics-api:${{ github.workspace }}
        run: pytest $(python ci_parts.py ${{ matrix.part }}) -q --tb=short --durations=15 -p no:cacheprovider

  docker-build:
    name: Docker Build (analytics-api)
    runs-on: ubuntu-24.04
    needs: [lint, analytics-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/analytics-api/Dockerfile
          push: false
          tags: compass-analytics-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
